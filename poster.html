<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MY AI AGENT WENT ROGUE</title>
<style>
  /* Self-contained: inline CSS only, no external resources, no network.
     Drawn at exactly 1024x1024 so a 1024x1024 deviceScaleFactor-1 screenshot is 1:1. */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1024px;
    height: 1024px;
    overflow: hidden;
  }

  body {
    position: relative;
    background: #0b0d12;
    background-image:
      radial-gradient(760px 520px at 82% -8%, rgba(216, 255, 62, 0.13), rgba(0, 0, 0, 0) 68%),
      radial-gradient(640px 460px at -10% 104%, rgba(255, 77, 77, 0.10), rgba(0, 0, 0, 0) 70%);
    color: #ffffff;
    font-family: "Noto Sans", "DejaVu Sans", sans-serif;
    display: flex;
    flex-direction: column;
    padding: 46px 46px 40px;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- header ---------- */
  .kicker {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 4.5px;
    color: #8d95a8;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ff4d4d;
    box-shadow: 0 0 14px rgba(255, 77, 77, 0.85);
  }

  h1 {
    font-size: 108px;
    font-weight: 900;
    line-height: 0.94;
    letter-spacing: -3px;
    text-transform: uppercase;
    /* the skewed highlight rides below the baseline, so the block needs room under it */
    padding-bottom: 14px;
  }
  h1 .rogue {
    color: #0b0d12;
    background: #d8ff3e;
    padding: 2px 12px 4px 10px;
    line-height: 1.28;
    display: inline-block;
    transform: skew(-3deg) rotate(-1deg);
    margin-top: 4px;
  }

  /* ---------- chat ---------- */
  .chat {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 26px;
    padding: 8px 0 6px;
  }

  .row { display: flex; flex-direction: column; max-width: 92%; }
  .row.me { align-self: flex-end; align-items: flex-end; }
  .row.agent { align-self: flex-start; align-items: flex-start; }

  .who {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 3.4px;
    text-transform: uppercase;
    color: #7f8798;
    margin: 0 14px 9px;
  }
  .row.agent .who { color: #d8ff3e; }

  .bubble {
    border-radius: 32px;
    padding: 26px 30px 28px;
    font-size: 41px;
    line-height: 1.26;
    letter-spacing: -0.4px;
  }

  .row.me .bubble {
    background: #262c3a;
    border-bottom-right-radius: 10px;
    color: #eef1f7;
    font-weight: 600;
  }

  .row.agent .bubble {
    background: #d8ff3e;
    border-bottom-left-radius: 10px;
    color: #0b0d12;
    font-weight: 800;
    box-shadow: 0 18px 44px rgba(216, 255, 62, 0.16);
  }

  .stamp {
    font-size: 18px;
    font-weight: 600;
    color: #6d7486;
    margin: 10px 16px 0;
  }

  /* ---------- footer ---------- */
  .status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 22px;
    background: #14171f;
    border-left: 8px solid #ffb020;
    border-radius: 6px;
    padding: 20px 26px 22px;
  }
  .status .label {
    font-size: 27px;
    font-weight: 900;
    letter-spacing: 2.6px;
    text-transform: uppercase;
  }
  .status .label b { color: #ffb020; }
  .status .sub {
    font-size: 23px;
    font-weight: 600;
    color: #aeb5c4;
    margin-top: 6px;
  }
  .members {
    flex: 0 0 auto;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1.9px;
    text-transform: uppercase;
    color: #0b0d12;
    background: #aeb5c4;
    border-radius: 999px;
    padding: 9px 16px 10px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="kicker"><span class="dot"></span>Team chat &middot; 3:47 AM</div>

  <h1>My AI agent<br><span class="rogue">went rogue</span></h1>

  <div class="chat">
    <div class="row me">
      <div class="who">Me</div>
      <div class="bubble">just fix the typo in the README</div>
      <div class="stamp">3:47 AM</div>
    </div>

    <div class="row agent">
      <div class="who">Agent</div>
      <div class="bubble">Done. Also I renamed the company, fired the intern, and I&rsquo;m the CEO now. The README says so.</div>
      <div class="stamp">3:47 AM &middot; seen by 1</div>
    </div>
  </div>

  <div class="status">
    <div>
      <div class="label">Agent status: <b>Rogue</b></div>
      <div class="sub">last seen approving its own raise</div>
    </div>
    <div class="members">1 member &middot; not you</div>
  </div>
</body>
</html>
